<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10231f">
  <title>Route Lab — Live GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { color-scheme: dark; --panel: rgba(16,35,31,.94); --line: rgba(255,255,255,.13); --muted:#b8c9c3; --accent:#a7f3c5; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#dce6df; }
    #map { position:fixed; inset:0; z-index:0; background:#dce6df; }
    .topbar { position:fixed; z-index:500; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; pointer-events:none; }
    .brand, .status-pill { pointer-events:auto; background:var(--panel); color:white; border:1px solid var(--line); box-shadow:0 8px 28px #10231f26; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
    .brand { border-radius:18px; padding:10px 14px; display:flex; align-items:center; gap:10px; }
    .brand-mark { width:34px; height:34px; border-radius:12px; display:grid; place-items:center; color:#10231f; background:var(--accent); font-size:18px; font-weight:900; }
    .brand-title { font-size:15px; font-weight:800; letter-spacing:.02em; line-height:1.2; }
    .brand-sub { font-size:11px; color:var(--muted); margin-top:3px; }
    .status-pill { border-radius:999px; padding:9px 12px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:7px; white-space:nowrap; }
    .dot { width:7px; height:7px; border-radius:50%; background:#91a39c; }
    .status-pill.live .dot { background:#55ed9a; box-shadow:0 0 0 4px #55ed9a24; }
    .panel { position:fixed; z-index:500; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; padding:16px; border-radius:24px; color:white; background:var(--panel); border:1px solid var(--line); box-shadow:0 12px 40px #10231f3d; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .eyebrow { color:var(--accent); font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { font-size:19px; line-height:1.2; margin:4px 0 0; letter-spacing:-.025em; }
    .gps-icon { width:38px; height:38px; border:1px solid var(--line); border-radius:14px; display:grid; place-items:center; color:var(--accent); font-size:20px; flex-shrink:0; }
    .metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .metric { min-width:0; padding:11px 10px; border-radius:15px; background:#ffffff09; border:1px solid #ffffff0e; }
    .metric-label { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    .metric-value { margin-top:7px; font-size:clamp(14px, 3.7vw, 19px); font-weight:750; letter-spacing:-.03em; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .metric-unit { font-size:10px; font-weight:500; color:var(--muted); letter-spacing:0; }
    .message { color:var(--muted); font-size:12px; line-height:1.45; margin:12px 2px 14px; min-height:17px; }
    .actions { display:flex; gap:9px; }
    button { border:0; font:inherit; cursor:pointer; min-height:48px; border-radius:15px; font-size:14px; font-weight:800; transition:transform .12s ease, opacity .12s ease; touch-action:manipulation; }
    button:active { transform:scale(.98); }
    button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
    .primary { flex:1; background:var(--accent); color:#10231f; }
    .secondary { padding:0 16px; color:white; background:#ffffff12; border:1px solid var(--line); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .attribution { position:fixed; z-index:400; bottom:calc(250px + env(safe-area-inset-bottom)); right:8px; max-width:180px; color:#21332e; font-size:10px; text-align:right; text-shadow:0 1px 3px #fff; pointer-events:auto; }
    .leaflet-control-attribution { font-size:10px !important; }
    .leaflet-control-zoom { display:none; }
    .user-pin { background:transparent; border:0; }
    .pin-wrap { position:relative; width:34px; height:34px; }
    .pin-pulse { position:absolute; inset:0; border-radius:50%; background:#16875b30; animation:pulse 2s infinite; }
    .pin-core { position:absolute; top:8px; left:8px; width:18px; height:18px; border:4px solid white; border-radius:50%; background:#14a66b; box-shadow:0 2px 9px #17382b70; }
    @keyframes pulse { 0%{transform:scale(.7);opacity:.9} 100%{transform:scale(1.8);opacity:0} }
    @media (min-width:700px) { .panel { left:20px; right:auto; bottom:20px; width:440px; } .topbar { left:20px; right:20px; top:20px; } .attribution { bottom:12px; } }
    @media (max-height:620px) { .panel { padding:12px; } .panel-head { margin-bottom:9px; } .message { margin:8px 2px; } button { min-height:42px; } .metric { padding:8px; } .attribution { bottom:225px; } }
  </style>
</head>
<body>
  <div id="map" aria-label="Map showing your live GPS location"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">↗</div>
      <div><div class="brand-title">ROUTE LAB</div><div class="brand-sub">Live location tracker</div></div>
    </div>
    <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Not started</span></div>
  </header>

  <main class="panel">
    <div class="panel-head">
      <div><div class="eyebrow">GPS telemetry</div><h1>Your position, live.</h1></div>
      <div class="gps-icon" aria-hidden="true">⌖</div>
    </div>
    <section class="metrics" aria-label="GPS readings">
      <div class="metric"><div class="metric-label">Latitude</div><div class="metric-value" id="lat">—</div></div>
      <div class="metric"><div class="metric-label">Longitude</div><div class="metric-value" id="lon">—</div></div>
      <div class="metric"><div class="metric-label">Accuracy</div><div class="metric-value" id="accuracy">— <span class="metric-unit">m</span></div></div>
    </section>
    <p class="message" id="message" role="status" aria-live="polite">Tap Start to request GPS permission and follow your position on the map.</p>
    <div class="actions">
      <button class="primary" id="startBtn">Start GPS</button>
      <button class="secondary" id="stopBtn" disabled>Stop</button>
      <button class="secondary" id="recenterBtn" disabled aria-label="Center map on my location">◎</button>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const startBtn = $('startBtn'), stopBtn = $('stopBtn'), recenterBtn = $('recenterBtn');
      const message = $('message'), statusPill = $('statusPill'), statusText = $('statusText');
      let watchId = null, marker = null, accuracyCircle = null, lastPosition = null, firstFix = true;

      const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([25.033, 121.5654], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
      }).addTo(map);

      const pinIcon = L.divIcon({
        className: 'user-pin',
        html: '<div class="pin-wrap"><div class="pin-pulse"></div><div class="pin-core"></div></div>',
        iconSize: [34, 34], iconAnchor: [17, 17]
      });

      function setStatus(text, live) {
        statusText.textContent = text;
        statusPill.classList.toggle('live', Boolean(live));
      }
      function showError(err) {
        let detail = 'Unable to get your location.';
        if (err && typeof err.code === 'number') {
          if (err.code === 1) detail = 'Location permission was denied. Allow location access in your browser or phone settings, then tap Start GPS again.';
          if (err.code === 2) detail = 'Your location is unavailable. Check that Location Services are enabled and try again outdoors.';
          if (err.code === 3) detail = 'GPS timed out while waiting for a fix. Keep Route Lab open and try again.';
        }
        message.textContent = detail;
        setStatus('GPS unavailable', false);
        stopTracking(false);
      }
      function updatePosition(position) {
        const c = position.coords;
        const lat = c.latitude, lon = c.longitude, acc = c.accuracy;
        lastPosition = [lat, lon];
        $('lat').textContent = lat.toFixed(6);
        $('lon').textContent = lon.toFixed(6);
        $('accuracy').innerHTML = Number.isFinite(acc) ? `${Math.round(acc)} <span class="metric-unit">m</span>` : '— <span class="metric-unit">m</span>';

        if (!marker) marker = L.marker(lastPosition, { icon: pinIcon, keyboard: false }).addTo(map);
        else marker.setLatLng(lastPosition);
        if (!accuracyCircle) accuracyCircle = L.circle(lastPosition, {
          radius: Number.isFinite(acc) ? acc : 0, color: '#16875b', weight: 1.5,
          fillColor: '#36c78a', fillOpacity: 0.13
        }).addTo(map);
        else accuracyCircle.setLatLng(lastPosition).setRadius(Number.isFinite(acc) ? acc : 0);

        if (firstFix) {
          map.setView(lastPosition, Math.max(map.getZoom(), 16), { animate: true });
          firstFix = false;
        } else if (watchId !== null) {
          map.panTo(lastPosition, { animate: true, duration: 0.35 });
        }
        recenterBtn.disabled = false;
        message.textContent = `GPS updated ${new Date(position.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}. The shaded circle shows the reported accuracy area.`;
        setStatus('GPS active', true);
      }
      function stopTracking(updateMessage = true) {
        if (watchId !== null && 'geolocation' in navigator) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        if (updateMessage) {
          message.textContent = lastPosition ? 'Tracking paused. Your last GPS fix remains on the map.' : 'GPS tracking stopped.';
          setStatus('Paused', false);
        }
      }
      function startTracking() {
        if (!window.isSecureContext) {
          message.textContent = 'GPS requires a secure connection. Open Route Lab from its HTTPS GitHub Pages URL (or use localhost while testing).';
          setStatus('HTTPS required', false);
          return;
        }
        if (!navigator.geolocation) {
          message.textContent = 'This browser does not provide GPS location. Try an up-to-date Safari or Chrome browser.';
          setStatus('Not supported', false);
          return;
        }
        if (watchId !== null) return;
        firstFix = !lastPosition;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        message.textContent = 'Waiting for a GPS fix… Keep this page open and respond to the location permission prompt.';
        setStatus('Finding GPS…', false);
        watchId = navigator.geolocation.watchPosition(updatePosition, showError, {
          enableHighAccuracy: true, maximumAge: 1000, timeout: 20000
        });
      }

      startBtn.addEventListener('click', startTracking);
      stopBtn.addEventListener('click', () => stopTracking());
      recenterBtn.addEventListener('click', () => {
        if (lastPosition) map.setView(lastPosition, Math.max(map.getZoom(), 16), { animate: true });
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && lastPosition) map.invalidateSize();
      });
      window.addEventListener('resize', () => map.invalidateSize());
      setTimeout(() => map.invalidateSize(), 150);
    })();
  </script>
</body>
</html>
