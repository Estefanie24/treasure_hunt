<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Live GPS Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map" role="application" aria-label="Map"></div>
<header id="panel" aria-live="polite">
  <div class="cell"><span class="k">Latitude</span><span class="v" id="lat">–</span></div>
  <div class="cell"><span class="k">Longitude</span><span class="v" id="lng">–</span></div>
  <div class="cell"><span class="k">Accuracy</span><span class="v" id="acc">–</span></div>
  <div class="cell wide"><span class="k">Status</span><span class="v" id="status">Not started</span></div>
  <p id="msg" role="alert" hidden></p>
</header>
<footer id="bar">
  <p id="intro">Tap Start to show your live position. Your location stays on this device and is never uploaded.</p>
  <button id="ctr" type="button" hidden>Re-center</button>
  <button id="go" type="button">Start</button>
</footer>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
